# ローカルの3層（画面・API・DB）を1コマンドで起動する（完了条件1）。
# DB（保存の層）、API（処理の層、Day 3）、画面（表示の層、frontend ＋ nginx、Day 4）。
# 画面：http://127.0.0.1:8080　API の説明と試しの画面：http://127.0.0.1:8000/docs
# 使い方：env.example を .env に写して値を変え、docker compose up -d
name: ecu-sec

services:
  db:
    # PostgreSQL 18。最新は 19.0（2026-11-19 公開）だが、Phase 3 で RDS に載せるため、RDS が対応している版にそろえる
    # （Day 12 に RDS の対応版を公式で確かめ、必要なら上げる）。版の一覧：https://www.postgresql.org/support/versioning/
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env に POSTGRES_DB を書く}
      POSTGRES_USER: ${POSTGRES_USER:?.env に POSTGRES_USER を書く}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を書く}
    ports:
      # 手元の PC からだけ接続できるように 127.0.0.1 に限る（0.0.0.0 だと同じネットワークの機械からも届く）
      - "127.0.0.1:5432:5432"
    volumes:
      # データは名前付きボリュームに置く（docker compose down では消えない。down -v で消える）
      - db-data:/var/lib/postgresql
    healthcheck:
      # 接続を受け付けられるかを確かめる（API は Day 3 から、これが通るまで待って起動する）
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # API（処理の層）。backend/Dockerfile から作る
    build: ./backend
    restart: unless-stopped
    # 起動のたびに、テーブルを最新にし（Alembic）、ダミーデータを入れてから API を動かす。
    # どちらも、済んでいれば何もしない。これで docker compose up -d だけで使える状態になる（完了条件1）
    command: >-
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env に POSTGRES_DB を書く}
      POSTGRES_USER: ${POSTGRES_USER:?.env に POSTGRES_USER を書く}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を書く}
      # コンテナどうしは、サービスの名前（db）で相手を探す
      POSTGRES_HOST: db
      # トークン（JWT）の署名の鍵。既定の値は置かない（なければ起動しない）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?.env に JWT_SECRET_KEY を書く}
      # ダミーデータの利用者のパスワード（全員共通）。空なら全員ログインできない（「!」）
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      # 中継のヘッダー（X-Forwarded-For）を信じる相手は、nginx（web の固定のアドレス）だけ（SC3-26）。
      # uvicorn はこのアドレスから来た要求でだけ、ヘッダーを右から読んで本当の接続元を監査ログに残す。
      # ほかから来た要求（8000番を直接呼ぶなど）のヘッダーは使わない。"*"（すべて信じる）にしない。
      # 下の web の ipv4_address と同じ値にする（tests/web で確かめる）。出典：https://uvicorn.dev/settings/
      # 限界：Docker Desktop では、PC から来た接続はすべてネットワークの入口（172.30.0.1）に見えるので、
      # ローカルの監査ログの IP は 172.30.0.1 になる（2026-11-26 に確かめた）。AWS では ALB の後ろで信じる相手を決め直す（Day 13）
      FORWARDED_ALLOW_IPS: 172.30.0.10
    ports:
      # 手元の PC からだけ接続できるように 127.0.0.1 に限る
      - "127.0.0.1:8000:8000"
    depends_on:
      # DB が接続を受け付けられるようになってから起動する
      db:
        condition: service_healthy

  web:
    # 画面（表示の層）。frontend/Dockerfile で画面をビルドし、nginx で配る。
    # nginx が /api/ を API へ中継するので、画面と API は同じオリジンになる（frontend/nginx.conf）
    build: ./frontend
    restart: unless-stopped
    ports:
      # 手元の PC からだけ接続できるように 127.0.0.1 に限る。ブラウザで http://127.0.0.1:8080
      - "127.0.0.1:8080:80"
    depends_on:
      # API のコンテナが作られてから起動する（中継先の名前 api が見つかるように）
      - api
    networks:
      default:
        # nginx のアドレスを固定する。API はこのアドレスから来た中継のヘッダーだけを信じる（api の FORWARDED_ALLOW_IPS）
        ipv4_address: 172.30.0.10

networks:
  # 3層のコンテナがつながるネットワーク。アドレスの範囲を決めて、web のアドレスを固定できるようにする。
  # 172.30.0.0/24 は手元の Docker のほかのネットワーク（172.17〜172.19）と重ならない範囲。
  # VPN などとぶつかって起動しないときは、subnet・ip_range・web の ipv4_address・api の FORWARDED_ALLOW_IPS を一緒に変える。
  # この設定を変えたら、いまのネットワークを作り直すために一度 docker compose down（-v は付けない）してから up -d する。
  # 書き方の出典：https://docs.docker.com/reference/compose-file/networks/ （ipam）、
  #   https://raw.githubusercontent.com/compose-spec/compose-go/main/schema/compose-spec.json （ipv4_address）
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # 自動で配るアドレスは後ろ半分（.128〜.255）だけにする。固定の .10 をほかのコンテナに取られないように
          ip_range: 172.30.0.128/25
          # ネットワークの入口のアドレス。書かないと ip_range の先頭（.128）になった（2026-11-26 に確かめた）
          gateway: 172.30.0.1

volumes:
  db-data:
