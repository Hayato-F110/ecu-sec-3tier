# 画面（ビルドした静的なファイル）を配り、/api/ を API のコンテナへ中継する。
# 画面と API を同じオリジン（同じ「スキーム・ホスト・ポート」）にするので、API に CORS の設定が要らない。
# 書き方の出典：https://nginx.org/en/docs/http/ngx_http_proxy_module.html
#               https://nginx.org/en/docs/http/ngx_http_headers_module.html
# 決めた Host 名以外の要求を受ける既定の受け口（SC3-29）。DNS の付け替えの攻撃への守り：
# 悪いサイトが自分の名前の行き先を 127.0.0.1 に付け替えても、Host がその名前なので、ここで切られる。
# Host のない要求もここに来る。444：応答を返さずに接続を閉じる（nginx 独自の番号）
# 出典：https://nginx.org/en/docs/http/server_names.html ・ https://nginx.org/en/docs/http/ngx_http_rewrite_module.html#return
server {
    # 80番の要求で、どの server_name にも当たらないものを受ける
    listen 80 default_server;
    # どの本物の名前とも重ならない名前（意味はない。公式の例と同じ）
    server_name _;
    return 444;
}

server {
    listen 80;
    # 応答するのはこの名前の Host だけ（Host の後ろのポート :8080 は比べるときに使われない。tests/web で確かめる）
    server_name 127.0.0.1 localhost;
    # 応答のヘッダーと失敗の画面に nginx の版を出さない（攻撃者に手がかりを与えない）
    server_tokens off;
    # nginx が出す移動先（/api → /api/ など）を相対にする。絶対にすると、コンテナの中のポート 80 が入り、8080 番が抜け落ちる
    # 出典：https://nginx.org/en/docs/http/ngx_http_core_module.html#absolute_redirect
    absolute_redirect off;
    root /usr/share/nginx/html;

    # 守りのヘッダー。always：失敗の応答（404 など）にも付ける
    # CSP：読み込んでよい先を自分のサイトだけに限る（よそのスクリプトを動かさせない）。
    #      frame-ancestors 'none'：ほかのサイトの枠の中に表示させない（見えない枠でクリックさせる攻撃を防ぐ）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 送られたファイルの種類を、ブラウザに推測させない
    add_header X-Content-Type-Options "nosniff" always;
    # ほかのサイトへ移るときに、この画面の URL（ECU の番号を含む）を渡さない
    add_header Referrer-Policy "no-referrer" always;

    # 相手の名前（api）を、起動時の1回だけでなく、10秒ごとに引き直す。127.0.0.11 は Docker の中の名前解決の窓口。
    # api のコンテナだけを作り直すと IP が変わることがあり、引き直さないと 502 になり続ける
    # 出典：https://nginx.org/en/docs/http/ngx_http_core_module.html#resolver
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # コンテナどうしは、サービスの名前（api）で相手を探す。パスはそのまま渡す（/api/ecus → /api/ecus）。
        # 変数にすると、名前を上の resolver で引き直す（変数を使わないと、起動時の1回だけ）
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        # API へ渡す Host は、ブラウザが送ったまま（ポートを含む。例 127.0.0.1:8080）。
        # $host だとポートが落ち、API の移動（/api/ecus/ → /api/ecus）が 80 番へ向かう。
        # この server に来るのは server_name が 127.0.0.1・localhost の要求だけ（SC3-29）
        proxy_set_header Host $http_host;
        # 本当の接続元を API に伝える。X-Forwarded-For は、届いた値の右に $remote_addr（nginx に来た接続元）を足す。
        # API は nginx の固定のアドレスから来たときだけ、右から読んで接続元にする（docker-compose.yml の FORWARDED_ALLOW_IPS。SC3-26）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ビルドした JS・CSS（名前に中身の指紋が入る）。ないファイルは 404 にする。
    # index.html を 200 で返すと、ブラウザは nosniff で読み込みを止め、画面が真っ白になって原因も分からない
    location /assets/ {
        try_files $uri =404;
    }

    # 画面の入口は毎回サーバーに確かめさせる（古い index.html が、もうない JS を指し続けないように）。
    # add_header ではなく expires を使う：場所ごとに add_header を書くと、上の守りのヘッダーを引き継がなくなる
    # 出典：https://nginx.org/en/docs/http/ngx_http_headers_module.html（expires の負の値は Cache-Control: no-cache）
    location = /index.html {
        expires -1;
    }

    location / {
        # 画面の URL（/ecus/3 など）を直接開いても、画面の入口（index.html）を返す
        try_files $uri /index.html;
    }
}
